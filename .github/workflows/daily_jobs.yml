name: Daily Internship Digest

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  find-and-send-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ── 1. Pull your code ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Set up Python ──────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the agent ──────────────────────────────
      - name: Run AI Career Agent
        env:
          GROK_API_KEY:   ${{ secrets.GROK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          SERPAPI_KEY:    ${{ secrets.SERPAPI_KEY }}
        run: python main.py

      # ── 5. Upload jobs JSON as artifact ───────────────
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ github.run_id }}
          path: jobs_*.json
          retention-days: 30

      # ── 6. Commit seen_jobs.json back to repo ─────────
      - name: Save job memory to repo
        if: always()
        run: |
          git config user.name "Career Agent Bot"
          git config user.email "bot@career-agent.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "chore: update job memory $(date +%Y-%m-%d)"
          git push