name: Daily Internship Digest

on:
  # ── Runs every day at 8:00 AM IST (2:30 AM UTC) ──
  schedule:
    - cron: "30 2 * * *"

  # ── Also allows manual trigger from GitHub UI ──
  workflow_dispatch:

jobs:
  find-and-send-jobs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Pull your code ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the agent ──────────────────────────────
      - name: Run AI Career Agent
        env:
          GROK_API_KEY:  ${{ secrets.GROK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
        run: python main.py

      # ── 5. Upload jobs JSON as artifact ───────────────
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ github.run_id }}
          path: jobs_*.json
          retention-days: 30